# feedbackd mit Vorrang zwischen gleichzeitigen Rueckmeldungen (Ueberblick README).
# 0001: jede Rueckmeldung hat eine Prioritaet (bisher nur LED, ungenutzt); je LED gewinnt das Muster mit der hoechsten
# Prioritaet, nach seinem Ende kommt das naechste zurueck (bisher: letzter Start gewinnt, jedes Ende schaltet aus).
# Dauerlicht (Frequenz 0) als konstantes Muster, sonst lief ein vorheriges Blinkmuster weiter.
# 0002: Motor: hoehere Prioritaet bricht niedrigere ab, sonst verworfen; jedes Ereignis bricht die Haptic-Schnittstelle
# ab (die Belegt-Pruefung kam vorher, Ereignisse wurden verworfen). Ton: verworfen, solange ein hoeherer spielt. Apps
# ausserhalb allow-important hoechstens 128.
# 0003: Prioritaeten im Standardthema (Alarm 192, Benachrichtigung 128, Erinnerung 120), neues Ereignis
# battery-charging (Dauerlicht, 64) fuer die Ladeanzeige von plasma-mobile.
# 0004: Wecker-Vibration (alarm-clock-elapsed, quiet) hatte keine Prioritaet (0) und wurde von jeder anderen Vibration
# beendet; jetzt 192 wie der Anruf.
QUELLE=feedbackd
DEBIAN=0.8.11-1
DSC_SHA256=6c0e39e542b22cf18e41f42322b4dd65519289e5a72fd0ddde9e638fcf3d93e1
REVISION=2
STATUS=aktiv
# feedbackd haengt an feedbackd-common (>= der genauen Quellfassung), also auch arch:all bauen
BAUART=source,any,all
IMAGE="feedbackd feedbackd-common libfeedback-0.0-0"
IMAGE_AN=0
CHANGELOG="leds: every feedback type has a priority; an LED shows the pattern with the highest priority and shows the next one again when it ends, instead of turning off; a constant light replaces a running blink pattern.
manager: a vibration ends one of a lower priority and is dropped otherwise, every event ends a pattern of the haptic interface; a sound is dropped while one of a higher priority plays; applications outside allow-important use at most priority 128.
data: priorities in the default theme, new event battery-charging with a constant LED.
data: the vibration of alarm-clock-elapsed has the priority of an alert; with none, any other vibration ended it."
