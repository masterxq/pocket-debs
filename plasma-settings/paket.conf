# plasma-settings: neue Option --args wie bei systemsettings; die Argumente gehen an das mit --module geoeffnete
# Modul (beim Laden, oder ueber activationRequested, wenn es schon offen ist). Damit oeffnet plasma-mobile +pd24
# beim Langdruck auf eine Benachrichtigung die Seite der Anwendung in kcm_notifications (--desktop-entry,
# --notifyrc); ohne das zeigt plasma-settings nur die Uebersicht der Benachrichtigungseinstellungen. Die Seite des
# Moduls kommt vor dem Laden auf den Seitenstapel, damit Seiten, die das Modul beim Laden oeffnet, darueber liegen.
QUELLE=plasma-settings
DEBIAN=26.08.3-1
DSC_SHA256=50228e1e3431549c45c0ff4ba2127146b5ea41a8f58c64c155d685e5da2132e5
REVISION=2
STATUS=aktiv
IMAGE="plasma-settings"
IMAGE_AN=0
CHANGELOG="settings: new option --args: arguments for the module opened with --module, passed when it loads or through activationRequested when it is open already (e.g. kcm_notifications opens the settings of one application); the page of a module is on the page stack before it loads, so pages it opens while loading come after it."
