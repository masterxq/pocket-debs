# Qt 6 Base mit Kontextmenue auf langen Touch-Druck in Texteingabefeldern der Qt-Widgets (QLineEdit, QTextEdit,
# QPlainTextEdit, editierbare Combo- und Drehfelder). Ohne Hardware-Tastatur liess sich in solche Felder sonst nichts
# einfuegen und nichts aus ihnen kopieren (die Bildschirmtastatur hat keine Strg-Taste). Betrifft jedes Geraet mit
# Touchscreen; Qt-Quick-Apps haben das Menue schon in ihren Textfeldern.
# Dazu Upstream-Fixes e26d5a8e und b4dd5276 (dev, 6.12) im Wayland-Plugin (libQt6WaylandClient): die Texteingabe
# folgt dem Fokusobjekt. Vorher blieb sie eingeschaltet, wenn der Fokus innerhalb eines Fensters von einem Textfeld
# auf ein anderes Element ging; die Bildschirmtastatur blieb offen und Tippen ging ins Leere.
QUELLE=qt6-base
DEBIAN=6.11.2+dfsg-8
DSC_SHA256=8c57a8555ae801bba70b11e0108cd8863864741438b655b58333476b05c80c07
REVISION=2
STATUS=aktiv
# Die Aenderungen stecken in libQt6Widgets und libQt6WaylandClient
IMAGE="libqt6widgets6 libqt6waylandclient6"
IMAGE_AN=1
CHANGELOG="QWidgetWindow: open the context menu of text input widgets on a touch press and hold.
qpa/wayland: enable and disable text input based on the focus object (upstream commits e26d5a8e and b4dd5276): text input no longer stays enabled after focus moved from a text field to an item without text input."
