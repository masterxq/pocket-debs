# pipewire (Ueberblick README).
# 0001: pulse-server, Erweiterung stream-restore: WirePlumber speichert die Restore-Eintraege mit Lautstaerken, aber ohne
# Kanalpositionen; READ lieferte Lautstaerken je Kanal und eine leere Kanalbelegung. libpulse verweigert das
# Zurueckschreiben eines solchen Eintrags (Lautstaerke passt nicht zur Kanalbelegung), so schlug z. B. die
# Stummschaltung der Rolle event (Nicht-stoeren der Shell) fehl. Eintraege ohne passende Belegung bekommen die
# Standardbelegung fuer ihre Kanalzahl.
QUELLE=pipewire
DEBIAN=1.6.9-2
DSC_SHA256=e5ec430d51f53d5c9f7220cadf2943950c7b1ca3a51eb608ef6e7dbdeb5b5895
REVISION=1
STATUS=aktiv
# die Quelle baut auch arch:all-Pakete (Doku, gemeinsame Daten)
BAUART=source,any,all
IMAGE="pipewire pipewire-bin pipewire-pulse pipewire-alsa pipewire-audio pipewire-libcamera libpipewire-0.3-0t64 libpipewire-0.3-modules libspa-0.2-modules libspa-0.2-bluetooth libspa-0.2-libcamera gstreamer1.0-pipewire"
IMAGE_AN=0
CHANGELOG="pulse-server: stream-restore: an entry stored without channel positions is read with the default channel map for its number of volumes; clients could not write such an entry back (e.g. muting the event role)."
