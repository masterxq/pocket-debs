# plasma-mobile mit mehreren Modems: Statusleiste zeigt das Signal jeder SIM (nur Balken, nach Schacht), die SIM mit
# Datenverbindung mit Netztyp (network-mobile-<staerke>-<typ>), das Internet-Symbol zeigt Mobilfunk dann nicht noch
# einmal (WLAN, Hotspot, Verbindungsaufbau weiter); Schnelleinstellung
# "Mobile Daten" und Ersteinrichtung folgen dem Daten-Modem (plasma-nm CellularModemList.dataModem), die
# APN-Erkennung bindet neue Profile an die SIM und startet bei mehreren Modems keine Verbindung von selbst.
# Braucht plasma-nm aus diesem Repo (neue Eigenschaften der QML-Bibliothek org.kde.plasma.networkmanagement.cellular).
# 0003: deutsche Uebersetzung des Titels der Schnelleinstellung mit SIM. Signalanzeige ohne Bindungsschleife (Breite).
# 0004: Statusleiste mit festem Symbol je Verbindung (Balken je SIM, WLAN, Hotspot, Flugmodus) statt Internet-Symbol
# und Kringel, Breeze-Symbole wie bisher; beim Verbindungsaufbau pulst nur der Netztyp-Buchstabe im Mobilfunksymbol
# bzw. das WLAN-Symbol (8 Stufen/s, Konstante stepsPerSecond in IndicatorPulse.qml; nach 60 s rot), rotes X nach
# Fehlschlag. Braucht plasma-nm +pd6 (WirelessStatus.wifiState, ConnectionIcon.vpn/limited,
# CellularModem.mobileDataState).
# InternetIndicator.qml entfaellt (FEHLT_ERLAUBT).
# 0005, 0006: Upstream (master, Plasma 6.8): Laufschrift der Schnelleinstellungen laeuft nur bei offener Schublade,
# advanceWidth zwischengespeichert, Maske nur bei ueberlanger Schrift (sonst Animation im GUI-Thread von plasmashell
# mit ~60 Weckungen/s und Textsatz je Schritt, auch bei geschlossener Schublade).
# 0007: Sperrbildschirm zeigt Hinweise und Fehler des Fingerabdrucks (Texte kommen aus PAM: pam_fprintd,
# pam_lisbon_finger) ueber dem Symbol, Fehler 3 s lang mit Vibration (auch bei dunkler Anzeige).
# 0008: Upstream (master, c044c03c, nur LockScreenState.qml): Authentifizierung jede Sekunde neu starten, bis die PIN-
# Abfrage da ist. Nach einer automatischen Sperre (Gnadenfrist) startete 6.7 sie nie, der Finger blieb bis zur PIN aus.
QUELLE=plasma-mobile
DEBIAN=6.7.4-2
DSC_SHA256=7d38d8b40d59c337e15f18f16b97de7406f71bc45f64037fc7eb10d447406e30
REVISION=8
STATUS=aktiv
IMAGE="plasma-mobile"
IMAGE_AN=0
CHANGELOG="mobileshell: signal of every SIM in the status bar, the SIM with mobile data with its network type, no second mobile data icon; mobile data quick setting and initial setup follow the modem chosen for mobile data.
mobileshell: no binding loop on the width of the signal indicator.
kded/autodetectapn: bind detected connections to their SIM; with several modems add them without autoconnect.
po/de: German translation of the new strings.
mobileshell: status bar with one indicator per connection (signal of every SIM, Wi-Fi, hotspot, airplane mode) instead of the internet icon and its busy indicator; the letter of the network type in the icon of the mobile data SIM and the Wi-Fi icon pulse while the connection is activated and show a red cross after a failed activation; the icons are the ones of the plasma-nm connection icon.
quicksettings, MarqueeLabel: upstream fixes ce647d80 and 0f35c4af: a quick setting label scrolls only while the action drawer shows it, the text width is cached, the mask is used only for text that does not fit.
lockscreen: show hints and errors of the fingerprint reader; vibrate on a rejected finger.
lockscreen: upstream fix c044c03c (state handling): start authenticating again until the PIN prompt is there, so the fingerprint reader also works after an automatic lock with grace time."
FEHLT_ERLAUBT='/mobileshell/InternetIndicator\.qml$'
