# plasma-mobile mit mehreren Modems: Statusleiste zeigt das Signal jeder SIM (nur Balken, nach Schacht), die SIM mit
# Datenverbindung mit Netztyp (network-mobile-<staerke>-<typ>), das Internet-Symbol zeigt Mobilfunk dann nicht noch
# einmal (WLAN, Hotspot, Verbindungsaufbau weiter); Schnelleinstellung
# "Mobile Daten" und Ersteinrichtung folgen dem Daten-Modem (plasma-nm CellularModemList.dataModem), die
# APN-Erkennung bindet neue Profile an die SIM und startet bei mehreren Modems keine Verbindung von selbst.
# Braucht plasma-nm aus diesem Repo (neue Eigenschaften der QML-Bibliothek org.kde.plasma.networkmanagement.cellular).
# 0003: deutsche Uebersetzung des Titels der Schnelleinstellung mit SIM. Signalanzeige ohne Bindungsschleife (Breite).
# 0004: Statusleiste mit festem Symbol je Verbindung (Balken je SIM, WLAN, Hotspot, Flugmodus) statt Internet-Symbol
# und Kringel, Breeze-Symbole wie bisher; beim Verbindungsaufbau pulst nur der Netztyp-Buchstabe im Mobilfunksymbol
# bzw. das WLAN-Symbol (8 Stufen/s, Konstante stepsPerSecond in IndicatorPulse.qml; nach 60 s rot), rotes X nach
# Fehlschlag. Braucht plasma-nm +pd6 (WirelessStatus.wifiState, ConnectionIcon.vpn/limited,
# CellularModem.mobileDataState).
# InternetIndicator.qml entfaellt (FEHLT_ERLAUBT).
# 0005, 0006: Upstream (master, Plasma 6.8): Laufschrift der Schnelleinstellungen laeuft nur bei offener Schublade,
# advanceWidth zwischengespeichert, Maske nur bei ueberlanger Schrift (sonst Animation im GUI-Thread von plasmashell
# mit ~60 Weckungen/s und Textsatz je Schritt, auch bei geschlossener Schublade).
# 0007: Sperrbildschirm zeigt Hinweise und Fehler des Fingerabdrucks (Texte kommen aus PAM: pam_fprintd,
# pam_lisbon_finger) ueber dem Symbol, Fehler 3 s lang mit Vibration (auch bei dunkler Anzeige).
# 0008: Upstream (master, c044c03c, nur LockScreenState.qml): Authentifizierung jede Sekunde neu starten, bis die PIN-
# Abfrage da ist. Nach einer automatischen Sperre (Gnadenfrist) startete 6.7 sie nie, der Finger blieb bis zur PIN aus.
# 0009: nach falscher PIN die Fehlverzoegerung von PAM (pam_unix, ~2 s) abwarten, bevor die naechste Abfrage startet;
# sonst Tausende sofort scheiternde Versuche ("attempt too soon") und eine in der Zeit getippte PIN ungeprueft abgewiesen.
# 0010: systemweites Zurueck (docs/back-navigation.md): Navigationsleiste zeigt statt X einen Zurueck-Pfeil, solange
# das aktive Fenster meldet, dass Zurueck etwas bewirkt (kde_back_navigation_shell_v1, XML-Kopie in
# components/windowplugin/); Tippen schickt back an genau dieses Fenster. Tastatur ausblenden hat Vorrang. Braucht
# kwin +pd3 fuer den Pfeil; ohne das Protokoll im Compositor bleibt es beim X.
# 0011: SwipeArea folgt nur dem Finger, der die Geste begonnen hat; ein zweiter Finger (schnelles Tippen mit zwei
# Daumen auf dem Tastenfeld des Sperrbildschirms) galt sonst nach dem Abheben des ersten als dessen Bewegung: Taste
# abgebrochen, Tastenfeld zu, PIN geloescht. Andere Finger gehen an die Kinder.
# 0012: Sperrbildschirm-Inhalt (Uhr, Medien, Benachrichtigungen, Schnellknoepfe) bei offenem Tastenfeld ohne Eingabe;
# das Wischen der unsichtbaren Benachrichtigungskarten brach sonst seitlich verrutschte Tastendruecke ab.
# 0013: rechter Knopf (Tastatur ausblenden, Zurueck, Schliessen) mit eigenen Symbolen in einem Stil: 12-px-Raster, offene
# Striche mit runden Enden, Strich 1,4 (Schraegen wirken leichter als der Umriss des Aufgabenwechslers); Ressourcen des
# Applets, statt go-down-/go-previous-symbolic aus breeze-icons und mobile-close-app.
# 0014: Aktions-Handler der Benachrichtigungen uebergeben gueltige InvokeBehavior-Werte (vorher undefined): nach einer
# Aktion schliesst die Benachrichtigung wie am Desktop, ausser resident; Datei-Aktion "Papierkorb/Loeschen" schliesst sie.
# 0015: Inline-Antwort wird gesendet (Handler fuer replied fehlte, Text ging verloren); Popups mit Antwort zeigen die
# anderen Aktionen weiter, das Feld sofort nur, wenn die Antwort die einzige Aktion ist. Auf dem Sperrbildschirm braucht
# das Senden libnotificationmanager1 aus plasma-workspace +pd2 (WatchedNotificationsModel::reply), sonst wie bisher still.
# 0016: Auf dem Sperrbildschirm (oder in der Schublade darueber) angetippte Aktion laeuft nur, wenn das Entsperren direkt
# folgt: Tastenfeld schliessen oder Bildschirm aus verwirft sie (neue D-Bus-Methode cancelLockScreenUnlock von
# org.kde.plasmashell fuer die Schublade), falsche PIN behaelt sie bei offenem Tastenfeld; ohne Kennwort laeuft sie jetzt.
# 0017: Fingerabdruck am Sperrbildschirm ohne Text ueber dem Symbol (ersetzt die Anzeige aus 0007; die Hinweise von
# pam_fprintd nennen den registrierten Finger). Geraetevorgabe [Lockscreen] fingerprintReader (devices/spec.conf,
# envmanager), neu motorola,lisbon.conf mit true: Symbol immer da, durchgestrichen, solange der Finger nicht entsperrt
# (Fingerdienst lief und endete ohne Entsperren), bleibt bei offenem Tastenfeld stehen, schuettelt bei abgewiesenem
# Finger; im Tastenfeld der Grund (letzte Meldung des Fingerdienstes, wenn er binnen 1 s danach endete; pam_lisbon_finger
# gibt ihn so aus). false: kein Symbol; ohne Angabe Symbol nur waehrend der Fingerdienst wartet, wie bisher.
# 0018: Inline-Antwort in der Schublade: das Schubladenfenster bekommt erst mit dem Start der Antwort (Knopf oder Feld)
# Tastatur (on-demand), das Feld fordert die Tastatur nach der Aktivierung an; Schliessen blendet sie sofort aus. Ueber
# der Sperre geht der Start der Antwort ueber das Entsperren. Braucht layer-shell-qt +pd1 (sonst wird die Umstellung
# erst beim naechsten Neuzeichnen wirksam) und kwin +pd5 (sonst liegt die Tastatur unter der Schublade).
# 0019: Beschriftungen des Tastenfelds ("PIN eingeben", "Falsche PIN") in der Domaene des Shell-Pakets uebersetzen; der
# Greeter von kscreenlocker uebersetzt i18n() in seiner eigenen Domaene, dort fehlen sie (wie der Desktop: i18nd).
# 0020: Strich ueber dem Fingersymbol im Stil des Symbols (Linienstaerke 1/22, runde Enden, innerhalb 4..18 von 22, Luecke
# gleicher Breite aus dem Symbol ausgespart, wie die "disabled"-Symbole von Breeze); entsperrt der Finger nicht, oeffnet
# sich das Tastenfeld von selbst (beim Wechsel und bei jedem Einschalten der Anzeige), Wegwischen bleibt moeglich.
# 0021: in der Gnadenfrist nach einer automatischen Sperre (Authentifizierung noch nicht gestartet, jede Eingabe
# entsperrt) kein Fingersymbol, sondern der Pfeil wie ohne Sensor; das Symbol erscheint mit dem Start.
# 0022: Scrollen in den Benachrichtigungen, eine Aktion oder der Start einer Antwort klappt die ganz offenen
# Schnelleinstellungen auf die kompakte Groesse zusammen (wie die Schublade aufgeht, bleibt eingestellt); ein Antwortfeld
# mit Fokus wird ueber die Bildschirmtastatur gescrollt (Tastaturrechteck der Eingabemethode, Platz unter der letzten).
# 0023: Benachrichtigungen geben Ton/Vibration/LED ueber feedbackd (Ereignis nach Kategorie und Dringlichkeit, Anruf und
# Wecker solange die Benachrichtigung offen ist, KNotification-Apps ohne Ton von feedbackd, Nicht-stoeren nur LED ausser
# Wecker), Erinnerung auf der LED bis zum Entsperren oder Oeffnen der Schublade, Ladeanzeige (battery-charging),
# Bildschirm bei neuer Benachrichtigung einschalten (Einstellung, Vorgabe an). Vorrang regelt feedbackd +pd1.
QUELLE=plasma-mobile
DEBIAN=6.7.4-2
DSC_SHA256=7d38d8b40d59c337e15f18f16b97de7406f71bc45f64037fc7eb10d447406e30
REVISION=21
STATUS=aktiv
IMAGE="plasma-mobile"
IMAGE_AN=0
CHANGELOG="mobileshell: signal of every SIM in the status bar, the SIM with mobile data with its network type, no second mobile data icon; mobile data quick setting and initial setup follow the modem chosen for mobile data.
mobileshell: no binding loop on the width of the signal indicator.
kded/autodetectapn: bind detected connections to their SIM; with several modems add them without autoconnect.
po/de: German translation of the new strings.
mobileshell: status bar with one indicator per connection (signal of every SIM, Wi-Fi, hotspot, airplane mode) instead of the internet icon and its busy indicator; the letter of the network type in the icon of the mobile data SIM and the Wi-Fi icon pulse while the connection is activated and show a red cross after a failed activation; the icons are the ones of the plasma-nm connection icon.
quicksettings, MarqueeLabel: upstream fixes ce647d80 and 0f35c4af: a quick setting label scrolls only while the action drawer shows it, the text width is cached, the mask is used only for text that does not fit.
lockscreen: show hints and errors of the fingerprint reader; vibrate on a rejected finger.
lockscreen: upstream fix c044c03c (state handling): start authenticating again until the PIN prompt is there, so the fingerprint reader also works after an automatic lock with grace time.
lockscreen: wait for the PAM fail delay after a wrong PIN before the next attempt.
taskpanel: show a back arrow instead of the close button while the active window can go back (kde_back_navigation_shell_v1); tapping it goes back in that window.
mobileshell: SwipeArea follows only the finger that started the interaction; a second finger no longer moves or ends the swipe (lock screen keypad closed and cleared the PIN when typing with two thumbs).
lockscreen: the hidden content (notifications, media controls, quick action buttons) takes no input while the keypad is open.
taskpanel: icons for hiding the keyboard, back and close in one style (open strokes, slightly heavier) instead of the thin breeze-icons arrows next to the close icon.
notifications: valid invoke behaviors for actions (they were undefined); a notification closes after an action like on the desktop unless it is resident; move to trash/delete file actions close it.
notifications: inline replies are sent (the reply text was lost); popups with a reply action keep their other actions, the reply field shows right away only if the reply is the only action.
lockscreen: a notification action tapped on the lock screen or in the action drawer over it runs only if the unlock directly follows; closing the keypad or the display turning off drops it (new D-Bus method cancelLockScreenUnlock of org.kde.plasmashell); without authentication it now runs.
lockscreen: no fingerprint text above the icon; with a device preset that names a fingerprint reader (new: motorola,lisbon) the icon always shows, struck through while a finger does not unlock, stays when the keypad opens and shakes on a rejected finger; the keypad shows why a finger does not unlock.
actiondrawer: inline replies can be typed: the drawer takes keyboard focus once a reply starts (reply button or a tap on the reply field) and the input panel is requested after that; closing the drawer hides it. Over the lock screen starting a reply asks for the unlock first.
lockscreen: the labels of the keypad are translated (they were looked up in the translation domain of the greeter).
lockscreen: the slash over the fingerprint icon is drawn like the lines of the icon, with a gap cut out of the icon; while a finger does not unlock the keypad opens by itself.
lockscreen: no fingerprint icon in the grace time of an automatic lock, in which any input unlocks.
actiondrawer: scrolling the notifications, invoking an action or starting a reply collapses fully opened quick settings to their minimized size; a reply field with focus is scrolled above the on-screen keyboard.
notifications: sound, vibration and LED through feedbackd chosen by category and urgency (calls and alarms as long as their notification is open, no feedbackd sound for applications that play their own, only the LED in do not disturb mode except alarms); a reminder on the LED for notifications that arrived while locked or with the display off, until unlock or the action drawer opens; the LED shows charging; a new notification turns the display on (setting, on by default)."
FEHLT_ERLAUBT='/mobileshell/InternetIndicator\.qml$'
