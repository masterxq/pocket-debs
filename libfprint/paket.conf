# libfprint mit dem zusaetzlichen Treiber lisbonfpc: Fingerabdrucksensor des Moto G60s ueber den Dienst
# lisbon-fpc-bridge. fprintd, pam_fprintd und alles darueber bleiben die Pakete von Debian.
# Treiberquelle: dateien/libfprint/drivers/lisbonfpc.c (wird Patch pocket-debs/0000-pocket-debs-files.patch).
QUELLE=libfprint
DEBIAN=1:1.94.10-1
DSC_SHA256=156cf1c7fbfb7f23b814808fe1aaf5955378a4134ca36634a7edbc890edc8f50
REVISION=3
STATUS=aktiv
# Standard: OPTIONEN=nocheck (Tests nicht ausfuehren), keine Bauprofile (gleiche Paketinhalte wie Debian)
# Binaerpakete, die der Rootfs-Bau aus dem Repo installiert und per Pin haelt; IMAGE_AN=1: im Standard-Image
IMAGE="libfprint-2-2"
IMAGE_AN=1
DATEIEN_KOPF="Description: Add the lisbonfpc driver
 Driver for the fingerprint sensor of the Motorola Moto G60s (lisbon). The
 sensor sits behind the TEE; the driver talks to the local lisbon-fpc-bridge
 service, which reaches the vendor fingerprint HAL.
Author: pocket-debs
Forwarded: not-needed
License: LGPL-2.1-or-later"
CHANGELOG="Add the lisbonfpc driver (Moto G60s fingerprint sensor through the lisbon-fpc-bridge service).
lisbonfpc: a running operation continues across system sleep, so a touch can wake and unlock the phone.
lisbonfpc: answers of the bridge wait for the resume of the device; an operation that ended before it left the device busy for the close, which then stayed open after its client had gone."
# Treiber in der Bibliothek, keine neuen exportierten Symbole ausser fp_*
PRUEFEN='d=$(mktemp -d) && dpkg-deb -x libfprint-2-2_*_arm64.deb $d && so=$(ls $d/usr/lib/*/libfprint-2.so.2.*) &&
strings $so | grep -x lisbonfpc && ! nm -D --defined-only $so | awk "\$2 != \"A\" {print \$3}" | grep -v "^fp_"; r=$?; rm -rf $d; exit $r'
