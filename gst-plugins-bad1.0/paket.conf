# GStreamer-"bad"-Plugins mit Korrekturen fuer die zustandslosen V4L2-Decoder (v4l2codecs) und die MPEG-2-Basisklasse:
# H.264-Feldpaare warteten nur auf das erste Feld (letztes Bild eines Stroms teils falsch), MPEG-2 behielt nach einem
# wiederholten Sequenzkopf die Matrizen einer Quant-Matrix-Erweiterung. Betrifft jeden zustandslosen Decoder-Treiber.
QUELLE=gst-plugins-bad1.0
DEBIAN=1.28.9-1
DSC_SHA256=37ceee35eb41a6795c6bb6b36902f168b90161fe0843636b949e9d0ae521521b
REVISION=1
STATUS=aktiv
# libgstcodecs (MPEG-2-Basisklasse) liegt in libgstreamer-plugins-bad1.0-0, das Plugin v4l2codecs in
# gstreamer1.0-plugins-bad; das Plugin-Paket haengt an der Bibliothek genau derselben Fassung
IMAGE="libgstreamer-plugins-bad1.0-0 gstreamer1.0-plugins-bad"
IMAGE_AN=0
CHANGELOG="v4l2codecs: H.264 waits for the second field of a pair before output; MPEG-2 rebuilds the quantisation matrices from the sequence header for every picture. codecs: the MPEG-2 decoder keeps the matrices of earlier quant matrix extensions."
# Die Korrekturen hinterlassen keine Zeichenkette: geprueft wird, dass Plugin und Bibliothek in den Paketen liegen
PRUEFEN='d=$(mktemp -d) && dpkg-deb -x gstreamer1.0-plugins-bad_*_arm64.deb $d && dpkg-deb -x libgstreamer-plugins-bad1.0-0_*_arm64.deb $d && test -f $d/usr/lib/*/gstreamer-1.0/libgstv4l2codecs.so && test -f $d/usr/lib/*/libgstcodecs-1.0.so.0; r=$?; rm -rf $d; exit $r'
