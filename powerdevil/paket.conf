# PowerDevil mit dunklem Aufwachen durch einen Fingerabdrucksensor: Ein Geraet nennt die Art seiner Weckereignisse in
# der udev-Eigenschaft POWERDEVIL_WAKEUP_TYPE (Fingerabdruck: biometric, rootfs/fingerabdruck); es zaehlt als
# Weckquelle, wenn sein event_count im Schlafzyklus stieg (wakeup_count zaehlt ohne das wakeup_count-Protokoll nicht,
# systemd nutzt es nicht, die Erkennung von PowerDevil griff deshalb nie). Nach einem Fingerwecken bleibt die Anzeige
# aus; ohne Treffer schlaeft das Telefon nach 5 s ohne Eingabe wieder. Der Treffer schaltet ueber
# org.kde.Solid.PowerManagement.wakeup() ein (pam_lisbon_finger). wakeup() beendet jetzt das Warten auf Eingaben nach
# jedem dunklen Aufwachen und setzt die Leerlaufzeit der Anzeige (vorher: Schlaf trotz eingeschalteter Anzeige bzw.
# Anzeige ohne Abschaltzeit). Betroffen: libpowerdevilcore2 (SuspendController, Core) und powerdevil (Aktionen);
# powerdevil haengt an powerdevil-data (= Quellfassung), daher auch die arch:all-Pakete.
QUELLE=powerdevil
DEBIAN=4:6.7.4-2
DSC_SHA256=addbdec08fb337d015e03851c319c5e8c29d8aff5f2e6e7a2428855e4de5db01
REVISION=1
STATUS=aktiv
BAUART=source,any,all
IMAGE="libpowerdevilcore2 powerdevil powerdevil-data"
IMAGE_AN=1
CHANGELOG="suspendcontroller: a device declares the kind of its wakeups in the udev property POWERDEVIL_WAKEUP_TYPE and counts as wakeup source when its event count rose; new wakeup type biometric.
dpms, handlebuttonevents: after a biometric wakeup the display stays off and the device goes back to sleep after 5 s without user input.
core: a full wakeup ends the wait for user input after a wakeup that left the display off and restarts the display idle time."
