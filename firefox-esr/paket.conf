# Firefox ESR mit V4L2-Stateless-Decodern in der RDD-Sandbox (Mozilla-Bug 2080696, noch nicht uebernommen):
# der Broker gibt /dev/media* frei, wenn dessen Topologie einen schon zugelassenen M2M-Videoknoten enthaelt, dazu
# dessen uevent in sysfs; seccomp erlaubt im RDD-Prozess nur die vier Media-/Request-ioctls der Request API.
# Ohne das dekodiert Firefox mit libva-v4l2-request (MediaTek, Rockchip, Allwinner, Apple) nur in Software, ausser
# mit MOZ_DISABLE_RDD_SANDBOX=1. Entfaellt, sobald Debian eine Fassung mit dem Fix ausliefert (./bau.sh pruefen).
