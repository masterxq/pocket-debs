# Flare, Signal-Client mit GTK 4 und libadwaita (Rust), aus dem Upstream-Release; Debian hat ihn nicht (das Paket
# "flare" dort ist ein Spiel, daher der Name flare-signal). Das Release-Tarball aus der Paketregistry des
# GitLab-Projekts enthaelt alle Rust-Crates unter vendor/ (auch die Git-Abhaengigkeiten presage,
# libsignal-service-rs und libsignal) samt .cargo/config, der Bau braucht also kein Netz. Es deckt sich bis auf
# vendor/ und .cargo/config mit dem Tag; Upstream veroeffentlicht daneben dieselbe Pruefsumme
# (flare-<fassung>.tar.xz.sha256sum).
# Neue Fassung: UPSTREAM und TARBALL_SHA256 heben, REVISION=1; rust-version der Crates gegen rustc der Suite pruefen.
QUELLE=flare-signal
UPSTREAM=0.22.8
TARBALL=https://gitlab.com/api/v4/projects/37464215/packages/generic/flare/$UPSTREAM/flare-$UPSTREAM.tar.xz
TARBALL_SHA256=6bae69581de3c0261c60b8ee04b6281b503de998db3dfdaeda734b25ba5e1e1c
GITLAB=https://gitlab.com/schmiddi-on-mobile/flare
REVISION=1
STATUS=aktiv
IMAGE="flare-signal"
IMAGE_AN=0
CHANGELOG="Upstream release tarball with vendored Rust crates, built with meson and cargo in offline mode."
# Programm, Ressourcen, Desktop-Datei und Lizenzliste der Crates liegen im Paket
PRUEFEN='d=$(mktemp -d) && dpkg-deb -x flare-signal_*.deb $d && test -x $d/usr/bin/flare &&
test -f $d/usr/share/flare/resources.gresource && test -f $d/usr/share/applications/de.schmidhuberj.Flare.desktop &&
test -f $d/usr/share/doc/flare-signal/vendor-licenses.gz; r=$?; rm -rf $d; exit $r'
