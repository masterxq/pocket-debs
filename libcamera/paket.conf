# libcamera mit Sensor-Helfern fuer die Kameras des Moto G60s (OV64B40 hinten, OV16A1Q vorn): Verstaerkung,
# Schwarzwert und Verzoegerungen fuer den Software-ISP; dazu der Hardware-ISP (DIP) des MT6785 als
# Rechenschritt des Software-ISP (software_isp.mode = mtk-dip, braucht den DIP-Treiber im Kernel, sonst
# Rueckfall auf CPU/GPU), Autofokus und erweiterte Belichtungs-/Weissabgleichregelung der simple-IPA. Alle Binaerpakete einer Quelle haben dieselbe Fassung
# (libcamera-ipa prueft die Signatur der IPA-Module gegen libcamera0.7), deshalb installiert und pinnt das
# Image die ganze Gruppe.
# patches/aus/: vorbereitet, nicht angewendet (nur patches/*.patch zaehlen). 0002 legt die Ausgabepuffer des
# Software-ISP in den System-Heap statt in CMA; einschalten: nach patches/ verschieben, REVISION erhoehen.
QUELLE=libcamera
DEBIAN=0.7.2-1
DSC_SHA256=b162125bb8d26641b3b71ed32d344a06ae7fb4e732043db7a081615ffd039983
REVISION=9
STATUS=aktiv
IMAGE="libcamera0.7 libcamera-ipa libcamera-tools libcamera-v4l2 gstreamer1.0-libcamera"
IMAGE_AN=1
CHANGELOG="Camera sensor helpers and properties for OV64B40 and OV16A1Q (Moto G60s); simple IPA AGC with tunable step size and frame length extension. MediaTek MT6785 DIP as debayer backend of the software ISP (software_isp.mode = mtk-dip), contrast autofocus, zone metering and colour temperature curve AWB in the simple IPA. Pipeline handler and IPA mtkisp50 for the MT6785 ISP, used only when selected in pipelines_match_list."
