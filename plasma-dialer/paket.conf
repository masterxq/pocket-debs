# plasma-dialer mit mehreren Modems: Bei mehr als einem Modem waehlte der Dialer keines (selectModem "TODO"),
# Waehlen, USSD und Anrufbildschirm taten nichts. Neu: Standard-SIM fuer Anrufe (gemeinsam mit dem Mobilfunk-KCM und
# spacebar in simidentitiesrc, Vorgabe SIM im ersten Schacht),
# Waehlknopf mit SIM-Abzeichen, zweiter kleiner Waehlknopf fuer die andere SIM (bei 3+ SIMs Auswahl), Rueckruf aus
# dem Verlauf ueber die SIM des Anrufs, USSD ueber die Standard-SIM; der Modem-Daemon findet einen Anruf auf dem
# Modem, das ihn hat; der Anrufbildschirm zeigt Symbol und Namen der SIM des Anrufs und steuert den Anruf ueber deren
# Modem (ActiveCallModel.account). SIM-Symbole aus der gemeinsamen Datei simidentitiesrc (wie plasma-nm).
# Der Modem-Daemon verbindet sich je Modem-Objekt genau einmal (vorher bei jedem Modem-Auftauchen erneut, alte Objekte
# blieben ueber die Lambdas am Leben -> nach MM-Neustarts jeder Anruf mehrfach gemeldet).
# Davon unabhaengig (0001-0004, einzeln einreichbar): Kontaktansicht (Foto, Name, Nummern; Speichern per KPeople/vCard
# wie plasma-phonebook) aus Waehltasten, Kontakte-Tab und Anrufliste; Bearbeiten- und Anruf-Knopf je Kontakt;
# Anrufliste mit Kontaktfoto und Richtungsabzeichen, Rueckruf per Tipp; Kontaktsuche per Nummer im Daemon.
# 0007 setzt die SIM-Wahl darauf. 0008: deutsche Uebersetzung der neuen Texte.
# 0009 (unabhaengig): Der Daemon schickte beim Start den gelesenen Mikrofonzustand von callaudiod als Stummschaltung
# zurueck (callaudiod meldet direkt nach dem Start 0 = aus) -> Mikrofon nach jeder Anmeldung stumm, von WirePlumber
# gespeichert, Gegenstelle hoerte nichts. Jetzt: Zustand nur anzeigen, PropertiesChanged folgen. Ueber den Stummzustand
# entscheiden nur Nutzeranfragen; das Zuruecksetzen nach dem Anruf macht callaudiod (Moduswechsel).
QUELLE=plasma-dialer
DEBIAN=1:6.7.4-1
DSC_SHA256=31c36be3b3fbe69e04dd0f207c9d8297e7c3426ebb1189656c50e49630e461f9
REVISION=6
STATUS=aktiv
IMAGE="plasma-dialer"
IMAGE_AN=0
CHANGELOG="modem-daemon: look a call up on every modem when the named modem does not have it.
plasma-dialer: default SIM for calls shared with the cellular network settings, call button with the SIM as badge and a second call button for the other SIM, call back through the SIM of a call, SIM of the active call on the call screen.
modem-daemon: connect to each modem once, also after ModemManager restarted.
dialer: view to add and edit a contact; contacts: buttons to edit and to call a contact; history: photo of the contact with the direction of the call, call back with one tap; telephony: contact of a number looked up in the daemon.
po/de: German translation of the new strings.
daemon: follow the microphone and speaker state of callaudiod without sending it back as a request (the microphone was muted at every login); a call starts with the microphone on, and it is unmuted when the last call ends.
daemon: no longer unmutes the microphone itself at the start and the end of a call; callaudiod resets it when the call mode ends."
