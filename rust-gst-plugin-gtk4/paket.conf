# GStreamer-GTK4-Sink (gtk4paintablesink) mit dem Upstream-Fix d346b181 (gst-plugins-rs MR 3429): bei gekachelten
# DMA-BUFs steht in der Video-Meta die Kachelzahl statt des Byte-Abstands. Ohne den Fix gibt der Sink sie als
# Zeilenabstand an GTK weiter; MM21-Bilder des MediaTek-Videodecoders erscheinen in jedem GTK-4-Player mit dem Sink
# (GNOME Showtime) zerrissen und fast nur gruen. Entfaellt, sobald die Suite eine Fassung mit dem Fix hat.
QUELLE=rust-gst-plugin-gtk4
DEBIAN=0.15.2-4
DSC_SHA256=bb023a1586ac5c150a462aa088bb1ad5b4528a448e3fa81241fe9aa2d6bfe1cd
REVISION=1
STATUS=aktiv
IMAGE="gstreamer1.0-gtk4"
IMAGE_AN=0
CHANGELOG="gtk4paintablesink: pass the stride of tiled dmabufs in bytes (upstream commit d346b181, gst-plugins-rs MR 3429)."
# Der Fix hinterlaesst keine Zeichenkette: geprueft wird, dass das Plugin im Paket liegt
PRUEFEN='d=$(mktemp -d) && dpkg-deb -x gstreamer1.0-gtk4_*_arm64.deb $d && test -f $d/usr/lib/*/gstreamer-1.0/libgstgtk4.so; r=$?; rm -rf $d; exit $r'
