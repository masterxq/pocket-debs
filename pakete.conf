# Gemeinsame Einstellungen fuer die eigenen Fassungen von Debian-Paketen (bau.sh liest sie als Shell).
# Gilt fuer alle Pakete in diesem Repo.

# Eintrag im debian/changelog unserer Fassungen
MAINTAINER="lisbon <lisbon@localhost>"
# Kennung im Versionsschema: <debian-fassung>+lisbon<n>
VERSION_TAG=lisbon
# Felder des APT-Repositorys (Release-Datei); das Rootfs pinnt auf die genaue Fassung, nicht auf diese Felder
REPO_ORIGIN=lisbon
REPO_LABEL=lisbon
REPO_COMPONENT=main
REPO_DESCRIPTION="lisbon: Debian packages with patches for the Motorola Moto G60s"

# Debian-Suite, gegen die gebaut wird (dieselbe wie rootfs/mobian/suite.conf des Projekts; build/mobian.sh prueft das)
SUITE=forky
MIRROR=http://deb.debian.org/debian
# Fester Stand der Bauabhaengigkeiten: Zeitstempel von snapshot.debian.org (JJJJMMTTThhmmssZ). Leer = Spiegel.
SNAPSHOT=
