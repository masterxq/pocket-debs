# GTK 4 mit dem Upstream-Fix d4fa0b3b (GTK-Issue 8456): das GStreamer-Medienbackend markiert unter Wayland das
# EGLDisplay als fremd. Ohne ihn beendet GStreamer beim Freigeben des ersten GtkMediaFile das EGLDisplay, mit dem
# GTK zeichnet (eglTerminate); Apps mit dem GL-Renderer stuerzen dann ab (GNOME Snapshot beim zweiten Foto, weil
# der Ausloeseton je Foto ein neues GtkMediaFile ist). Betrifft jedes Geraet, auf dem GTK ueber GL zeichnet.
# Entfaellt, sobald die Suite eine GTK-Fassung mit dem Fix hat (./bau.sh pruefen).
QUELLE=gtk4
DEBIAN=4.24.1+ds-1
DSC_SHA256=43ca7e4305ba039a28451b818c5f2f0027ea998f3279fa2a18087e7a8146a640
REVISION=1
STATUS=aktiv
# libgtk-4-1 haengt an libgtk-4-common (>= Upstream-Fassung): die arch:all-Pakete bleiben die von Debian
IMAGE="libgtk-4-1"
IMAGE_AN=1
CHANGELOG="GStreamer media backend: mark the EGL display as foreign on Wayland (upstream commit d4fa0b3b, GTK issue 8456)."
# Der Fix ist in der Bibliothek: sie ruft gst_gl_display_egl_set_foreign
PRUEFEN='d=$(mktemp -d) && dpkg-deb -x libgtk-4-1_*_arm64.deb $d && grep -a -q gst_gl_display_egl_set_foreign $d/usr/lib/*/libgtk-4.so.1.*; r=$?; rm -rf $d; exit $r'
