# omacam (Kamera-App "Camera", Rust, GTK 4/libadwaita, spricht direkt mit libcamera; Upstream
# https://github.com/derekross/omacam, GPL-3.0-or-later) als Paket aus einem festen Upstream-Commit. Es gibt kein
# Debian-Quellpaket: debian/ liegt hier, die Rust-Kisten kommen aus dem Cargo.lock des Commits (CARGO_VENDOR=1) und
# liegen als orig-vendor-Archiv im Quellpaket, cargo baut ohne Netz. Patches: Linsentabelle fuer den Moto G60s,
# NV12-Bilder (Hardware-ISP) auf der CPU nach XRGB8888.
# Baut gegen libcamera-dev der Suite (Debian 0.7.2); laeuft mit jeder libcamera0.7 derselben Upstream-Fassung.
# STATUS=entwurf: nicht in "alle", Bau in der CI nur auf Anfrage (Run workflow, pakete: omacam).
# Neuer Upstream-Commit: UPSTREAM_URL, UPSTREAM_TAR_SHA256 (sha256 von "gzip -dc <archiv>", gleich
# "git archive --format=tar --prefix=omacam-<commit>/ <commit>"), DEBIAN hier und in debian/changelog.
QUELLE=omacam
ART=upstream
UPSTREAM_URL=https://github.com/derekross/omacam/archive/8d4981cfe86da734141a92d60661ecd9cb188ea1.tar.gz
UPSTREAM_TAR_SHA256=b9c8df99f41faffffe5ef45d903873947a00c9b278b0cfa1f4a7e67d06c2b370
CARGO_VENDOR=1
DEBIAN=0.3.3+git20261027.8d4981c-1
REVISION=1
STATUS=entwurf
IMAGE="omacam"
IMAGE_AN=0
CHANGELOG="Lens table for the Motorola Moto G60s (lisbon).
NV12 frames from the camera (hardware ISP) are converted to XRGB8888 on the CPU."
# Die App mit dem libcamera-Backend und der Linsentabelle fuer lisbon
PRUEFEN='d=$(mktemp -d) && dpkg-deb -x omacam_*_arm64.deb $d && grep -a -q "libcamera\.so\.0\.7" $d/usr/bin/omacam &&
grep -a -q "motorola,lisbon" $d/usr/bin/omacam && test -s $d/usr/share/doc/omacam/crate-licenses.txt.gz; r=$?; rm -rf $d; exit $r'
