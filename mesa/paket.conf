# Mesa mit zwei Panfrost-Fixes: (1) ein BO, dessen KMS-Handle exportiert wird, gilt als geteilt und geht nicht
# zurueck in den BO-Cache (Chromium exportiert solche Handles selbst; sonst Warnung im Kernel und moegliche Bildfehler).
# (2) Entkacheln von MTK 16L32S (MM21 der MediaTek-Videodecoder) vor Valhall: der Compute-Shader las nur die ersten
# <Hoehe> Kacheln, der Rest des Bilds blieb schwarz/gruen (Mali-G76, GStreamer glupload/waylandsink mit DMA_DRM).
# STATUS=entwurf: nicht in "alle", Fix am Geraet noch nicht geprueft; Bau unter qemu dauert mehrere Stunden.
# Ohne den Gallium-Treiber d3d12 (nur fuer WSL): 26.1.6 baut mit den DirectX-Headern der Suite nicht
# (debian-patches/0001), die Dateien dieses Treibers fehlen deshalb gegenueber Debian (FEHLT_ERLAUBT). Dort steht
# auch libgallium-<fassung>.so: die Datei traegt die Paketfassung im Namen und heisst bei uns zwangslaeufig anders.
QUELLE=mesa
DEBIAN=26.1.6-1
DSC_SHA256=062f1fe5cefd6d727bc13aea8733576d886c06297a9c6a3eadf75883128604c0
REVISION=1
STATUS=entwurf
IMAGE="libgbm1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri mesa-libgallium mesa-va-drivers mesa-vdpau-drivers mesa-vulkan-drivers"
IMAGE_AN=0
CHANGELOG="panfrost: mark a BO shared when its KMS handle is exported.
panfrost: fix MTK 16L32S detiling before Valhall (image dimensions of the tiled view).
Build without the d3d12 gallium driver (WSL only; it does not build against the current DirectX headers)."
FEHLT_ERLAUBT='d3d12|/libgallium-[0-9]'
