# Mesa 26.3 mit eigenen Patches fuer die Mali-G76 (Moto G60s). Basis ist Debians Quellpaket aus experimental, gebaut
# gegen die Suite; am Geraet gibt es keine experimental-Quelle. Sobald die Suite eine neuere Fassung als diese Basis
# fuehrt, zieht der Workflow nachziehen das Rezept dorthin.
# OpenGL (panfrost): (1) ein BO, dessen KMS-Handle exportiert wird, gilt als geteilt und geht nicht zurueck in den
# BO-Cache (Chromium exportiert solche Handles selbst). (2) Entkacheln von MTK 16L32S (MM21 der MediaTek-Videodecoder)
# vor Valhall: der Compute-Shader las nur die ersten <Hoehe> Kacheln.
# Vulkan (PanVK, Bifrost v7 mit Job-Manager), Patches 0003 bis 0020 aus dem Repo mesa-lisbon (Zweig lisbon/26.3, ein
# Commit je Patch): Freischaltung der G76 des MT6785, eigener Adressraum je VkDevice, Queue-Prioritaeten,
# textureQueryLod und Texel-Offsets bei MIRRORED_REPEAT, Grenzen von Cube-Storage-Images, Versatz von Rechtecklinien,
# Korrekturen an Draws (leerer Indexbereich, ohne Vertexpuffer, Input-Attachments, Poly-Heap, Submit-Fehler) und
# weniger Jobwechsel bei indizierten und indirekten Draws und bei Occlusion-Queries.
# Bau auf dem arm64-Runner; lokal unter qemu dauert er mehrere Stunden.
# FEHLT_ERLAUBT: libgallium-<fassung>.so traegt die Paketfassung im Namen und heisst bei uns zwangslaeufig anders.
QUELLE=mesa
DEBIAN=26.3.1-1
DSC_SHA256=c6a81e9e30f5b75e677c7cba39a5b9079bde2c373525c123d2798b0bace5ae61
REVISION=1
STATUS=aktiv
IMAGE="libgbm1 libegl-mesa0 libglx-mesa0 libgl1-mesa-dri mesa-libgallium mesa-va-drivers mesa-vdpau-drivers mesa-vulkan-drivers"
IMAGE_AN=0
CHANGELOG="panfrost: mark a BO shared when its KMS handle is exported.
panfrost: fix MTK 16L32S detiling before Valhall (image dimensions of the tiled view).
panvk: patches for the Mali-G76 (Bifrost v7, job manager) from mesa-lisbon, branch lisbon/26.3."
FEHLT_ERLAUBT='/libgallium-[0-9]'
