CHANGELOG="daemon: messages of every modem, the SIM of each message, send through a chosen SIM.
spacebar: replies through the SIM of the latest received message, default SIM shared with the cellular network settings, SIM choice per message.
daemon: a message goes only through the SIM asked for, the default SIM is the shared one.
spacebar: flat send button with the SIM as badge, long press chooses the SIM above the button; time of a message being sent.
po/de: German translation of the new strings."
