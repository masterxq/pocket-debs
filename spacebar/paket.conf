# spacebar mit mehreren Modems: Der Daemon nahm nur das erste Modem, SMS auf der SIM eines anderen Modems kamen nie
# an, gesendet wurde immer ueber das erste. Neu: Nachrichten aller Modems, SIM (ICCID) je Nachricht in der Datenbank
# (Migration 2026-11-25-120000_message_sim), Senden ueber die gewaehlte SIM, Antwort ueber die Eingangs-SIM,
# Standard-SIM gemeinsam mit dem Mobilfunk-KCM und plasma-dialer (simidentitiesrc), SIM-Knopf neben Senden fuer eine
# Abweichung je Nachricht (Langdruck auf den Sende-Knopf, der das SIM-Abzeichen traegt). Eine Nachricht fuer eine
# SIM, die kein Modem hat, scheitert statt ueber eine andere SIM zu gehen. MMS bleibt beim ersten Modem. SIM-Symbole aus der gemeinsamen Datei simidentitiesrc (wie
# plasma-nm). 0003: deutsche Uebersetzung der neuen Texte.
