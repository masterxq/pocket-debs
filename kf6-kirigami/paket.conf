CHANGELOG="PageRow: goBack() accepts the event when a page handles back and stops at the topmost layer; ApplicationItem goes back in the layers too and quits only from the back key.
New attached type BackNavigation: system-wide back navigation of a window over the Wayland protocol kde_back_navigation_v1.
PageRow, GlobalDrawer submenus, AbstractApplicationWindow and AbstractApplicationItem take part in the system-wide back navigation.
debian/control: build-depend on libwayland-dev and wayland-protocols.
PageRow: no anchors on the initial item of the layers stack (warning about conflicting anchors on every layer push, pop and replace)."
