# Kirigami mit systemweitem Zurueck (Uebersicht docs/back-navigation.md): Kirigami-Fenster melden dem Compositor ueber
# das Wayland-Protokoll kde_back_navigation_v1 (Kopie des XML in src/platform/, gleich dem in kwin), ob Zurueck gerade
# etwas bewirkt, und gehen bei seinem Ereignis einen Schritt zurueck; die Navigationsleiste von Plasma Mobile zeigt dann
# den Pfeil statt X. Braucht kwin und plasma-mobile aus diesem Repo; ohne das Global (anderer Compositor, ungepatchtes
# KWin, X11) aendert sich nichts.
# 0001: PageRow.goBack() akzeptiert das Ereignis auch, wenn die Seite Zurueck selbst behandelt, und haelt an der
#       obersten Ebene (Layer) an; ApplicationItem ersetzte goBack() durch eine Fassung ohne Layer, die auf Mobilgeraeten
#       die Anwendung beendete (auch ueber den Zurueck-Knopf der Kopfleiste), beendet jetzt nur noch ueber Taste/Kuerzel.
# 0002: neuer angehaengter Typ Kirigami.BackNavigation (enabled, triggered()) mit Verteiler je Fenster: oberstes
#       offenes Popup schliessen wie Esc (Dialog: reject), modales Popup ohne Esc sperrt, innere Navigation vor
#       aeusserer; Wayland-Anbindung in KirigamiPlatform (neue Bauabhaengigkeiten: debian-patches/0001).
# 0003: PageRow (Layer, Spalten), GlobalDrawer (Untermenues), AbstractApplicationWindow/-Item machen mit; Tests.
# 0004: PageRow: das Anfangselement des Layer-StackView (Spaltenansicht) ohne anchors.fill; sonst bei jedem layers.push,
#       pop und replace "StackView has detected conflicting anchors" (Qt warnt bei jedem Uebergang eines so verankerten
#       Elements), und replace konnte es nicht bewegen. Der negative obere Rand sitzt jetzt an den Kindern.
# Die arch-abhaengigen Pakete haengen an libkirigami-data (= Quellfassung): auch arch:all bauen.
