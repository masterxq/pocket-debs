# KWin mit zwei Korrekturen fuer die Bildschirmtastatur (KDE-Bug 459136): Nach dem Ausblenden der Tastatur behielt
# ein Fenster, das fuer sie verkleinert worden war, die verkleinerte Hoehe, wenn die Anwendung die Texteingabe selbst
# beendet (Firefox, wenn man neben das Eingabefeld tippt); erst ein erneutes Aktivieren gab ihm die volle Hoehe.
# (1) Upstream-Fix 0f3aee69 (Plasma/6.7, ab 6.7.6): KWin blendet die Tastatur beim Deaktivieren der Eingabemethode
#     sofort aus und gibt die Flaeche frei, statt auf die Antwort der Eingabemethode zu warten.
# (2) eigener Fix in XdgSurfaceWindow::moveResizeInternal: eine Groessenaenderung zurueck auf die zuletzt
#     uebernommene Groesse ging verloren, solange noch ein Configure mit anderer Groesse ausstand (Idee wie
#     upstream MR 9814, nicht uebernommen).
# (3) eigener Fix in XdgSurfaceWindow::maybeUpdateMoveResizeGeometry: Vollbild- und maximierte Fenster behalten die
#     angeforderte Geometrie, statt eine Zwischengroesse des Clients zu uebernehmen (nach Bildschirmdrehung blieb ein
#     Vollbildfenster sonst bei neuer Groesse geschnitten mit dem alten Puffer stehen, z. B. 415x415 statt 946x415).
# (4) Systemweites Zurueck (docs/back-navigation.md): eigene Wayland-Protokolle kde_back_navigation_v1 (Apps melden
#     je xdg_toplevel, ob Zurueck etwas bewirkt, und bekommen das Ereignis back) und kde_back_navigation_shell_v1
#     (Shell liest den Zustand ueber org_kde_plasma_window und loest back aus); Regeln nur in den XML-Beschreibungen
#     (src/wayland/protocols/). KWin leitet back nur bei gesetztem Zustand weiter, nicht bei modalem Dialog und nicht
#     bei gesperrter Sitzung. Neue Kopfdatei backnavigation_v1.h in kwin-dev.
# (5) Integrationstest testBackNavigation (wird mit BUILD_TESTING=OFF nicht gebaut).
# (6) Upstream-Fix 1bef92a (Plasma/6.7): kcm_virtualkeyboard und kcm_kwinxwayland linken Qt::Qml; mit den KDE
#     Frameworks der Suite scheitert der Bau sonst (qqml.h nicht gefunden).
# (7) Upstream-Fix 2ba43b48 (Plasma/6.8, KDE-Bug 524506): KWin zeigt die Eingabemethode nicht ohne Eingabekontext.
# (8) eigener Fix in textinput_v2/v3: show_input_panel/hide_input_panel nur vom Client mit Texteingabefokus; vorher
#     konnte eine App im Hintergrund die Tastatur ueber der aktiven App oeffnen oder schliessen.
# (9) eigener Fix in InputMethod: text-input-v2 hat kein commit; ein Client, der beim Wechsel in das naechste Textfeld
#     die Texteingabe im selben Stapel ab- und wieder einschaltet (Qt seit e26d5a8e, qt6-base +pd2), behaelt die
#     Eingabemethode und die Tastatur. Ohne das schloss (1) die Tastatur beim Wechsel von Feld zu Feld.
# (10) eigener Fix in InputMethod: blendet die Eingabemethode ihr Panel selbst aus (Taste auf der Tastatur), vergisst
#     KWin die Anzeigeanforderung. Vorher kam die Tastatur zurueck, sobald die App den Text des Felds aenderte
#     (plasma-keyboard blendet sich bei jeder Aenderung des umgebenden Texts wieder ein).
# (11) eigener Fix zu (7): eine Anzeigeanforderung vor der Aktivierung (Qt fragt vor dem Einschalten der Texteingabe)
#     zeigt ein schon gemapptes Panel bei der Aktivierung. Sonst blieb nach dem Start von plasma-keyboard das erste
#     Antippen eines Textfelds ohne Tastatur.
# (12) eigener Fix in InputPanelV1Window: das Panel kommt beim Zeigen nach oben. Es liegt in derselben Ebene wie
#     Layer-Shell-Overlays (Schublade, Benachrichtigungs-Popups von plasma-mobile); gehoert das Textfeld zu so einer
#     Flaeche, lag die Tastatur darunter (abgedunkelt, Beruehrungen gingen an die Flaeche).
# (13) eigener Fix in den Effekten slidingnotifications und slidingpopups: keine Schliess-Animation fuer Fenster, die nicht
#     gezeichnet werden (gesperrter Bildschirm). Die Animation lief nur beim Zeichnen weiter und hielt das
#     geschlossene Fenster samt letztem Puffer fest; nach vier Benachrichtigungs-Popups auf dem Sperrbildschirm
#     wartete plasmashell (Mesa-EGL) ewig auf einen freien Puffer und hing.
# Alle Dateien liegen in libkwin.so.6 (libkwin6). kwin-common haengt an kwin-data (= Quellfassung), daher werden
# auch die arch:all-Pakete gebaut. Entfaellt, sobald die Suite 6.8 oder neuer hat und (2) bis (5) und (8) bis
# (13) upstream sind.
QUELLE=kwin
DEBIAN=4:6.7.4-2
DSC_SHA256=579a9cd7743fc367d15573143cf1ef3ffd10f2ddb1a3b9892c375ba5a18b5967
REVISION=7
STATUS=aktiv
BAUART=source,any,all
IMAGE="libkwin6 kwin-common kwin-data kwin-wayland"
IMAGE_AN=1
CHANGELOG="inputmethod: immediately hide the OSK when deactivating the input method (upstream commit 0f3aee69, KDE bug 459136).
xdgshellwindow: send a configure event for a resize back to the committed size while a configure event with another size is pending.
xdgshellwindow: keep the requested geometry of fullscreen and maximized windows instead of taking over an interim size the client committed (window stuck at a partial size after rotating the screen).
wayland: back navigation: add kde_back_navigation_v1 (applications report per toplevel whether back has an effect and receive back) and kde_back_navigation_shell_v1 (a shell reads that state of a plasma window and asks for back).
autotests: integration test for back navigation.
inputmethod: do not try to show the input method without context (upstream commit 2ba43b48, KDE bug 524506).
wayland: text-input: show and hide the input panel only for the client with text input focus.
inputmethod: keep the input method active when a text-input-v2 client disables and enables text input in one batch.
inputmethod: forget the request to show the panel when the input method hides it by itself (keyboard came back when the application changed the text).
inputmethod: show a panel requested before the input method was activated (first tap after the start of plasma-keyboard showed no keyboard).
inputpanel: raise the panel when it is shown (it stayed below a layer-shell overlay surface holding the text field).
plugins: slidingnotifications, slidingpopups: no close animation for windows that are not painted (closed notifications on the lock screen kept their buffers, plasmashell hung waiting for a free buffer)."
