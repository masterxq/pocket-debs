# KWin mit zwei Korrekturen fuer die Bildschirmtastatur (KDE-Bug 459136): Nach dem Ausblenden der Tastatur behielt
# ein Fenster, das fuer sie verkleinert worden war, die verkleinerte Hoehe, wenn die Anwendung die Texteingabe selbst
# beendet (Firefox, wenn man neben das Eingabefeld tippt); erst ein erneutes Aktivieren gab ihm die volle Hoehe.
# (1) Upstream-Fix 0f3aee69 (Plasma/6.7, ab 6.7.6): KWin blendet die Tastatur beim Deaktivieren der Eingabemethode
#     sofort aus und gibt die Flaeche frei, statt auf die Antwort der Eingabemethode zu warten.
# (2) eigener Fix in XdgSurfaceWindow::moveResizeInternal: eine Groessenaenderung zurueck auf die zuletzt
#     uebernommene Groesse ging verloren, solange noch ein Configure mit anderer Groesse ausstand (Idee wie
#     upstream MR 9814, nicht uebernommen).
# Beide Dateien liegen in libkwin.so.6 (libkwin6). kwin-common haengt an kwin-data (= Quellfassung), daher werden
# auch die arch:all-Pakete gebaut. Entfaellt, sobald die Suite 6.7.6 oder neuer hat und (2) upstream ist.
QUELLE=kwin
DEBIAN=4:6.7.4-2
DSC_SHA256=579a9cd7743fc367d15573143cf1ef3ffd10f2ddb1a3b9892c375ba5a18b5967
REVISION=1
STATUS=aktiv
BAUART=source,any,all
IMAGE="libkwin6 kwin-common kwin-data kwin-wayland"
IMAGE_AN=1
CHANGELOG="inputmethod: immediately hide the OSK when deactivating the input method (upstream commit 0f3aee69, KDE bug 459136).
xdgshellwindow: send a configure event for a resize back to the committed size while a configure event with another size is pending."
