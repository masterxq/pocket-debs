# plasma-nm mit mehreren Modems (Dual-SIM mit einem ModemManager-Modem je Karte): Die Mobilfunk-Bibliothek
# (libs/cellular, auch von plasma-mobile genutzt) nahm fuer alles das erste Modem und benannte SIMs nach der
# MM-Objektnummer. Neu: SIM-Name "SIM <Schacht>" aus PrimarySimSlot, SIM-Symbol je ICCID in der gemeinsamen Datei
# simidentitiesrc (dieselbe Klasse SimIdentities liegt auch in plasma-dialer und spacebar), CellularModemList.dataModem
# als festes Daten-Modem (Autoconnect am an gsm.sim-id gebundenen Profil, kein automatischer Rueckfall), im KCM die
# Auswahl "SIM fuer mobile Daten" und die Symbolwahl je SIM. Plasma spricht nur ModemManager und NetworkManager.
