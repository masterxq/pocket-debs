CHANGELOG="cellular: SIM slot, SIM name and shared SIM icon, the modem for mobile data (CellularModemList.dataModem), the SIM for calls and text messages (CellularModemList.defaultModem), network type of a modem, connections bound to their SIM.
kcm_cellularnetwork: choice of the SIM for mobile data and of the SIM for calls and messages, SIM names and icons, icon choice per SIM.
cellular: the chosen modem for mobile data stays shown while it connects, a connection with the detected APN when the SIM has none, errors instead of silent failures, provider name when the network sends none.
kcm_cellularnetwork: errors of every modem, the mobile data switch no longer ignores the tap after a change, SIMs in slot order, notice while the data SIM is switched.
cellular: the operator name falls back to the provider of the SIM while it is in its home country, mobile data never takes a connection bound to another SIM.
po/de: German translation of the new strings."
