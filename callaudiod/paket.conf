# callaudiod: Lautsprecher im Gespraech ueber einen Profilwechsel. Mit PipeWire hat jedes UCM-Geraet eine eigene
# Senke, Hoerer und Lautsprecher liegen in verschiedenen Profilen "Voice Call (...)"; der Portwechsel, den
# callaudiod fuer den Lautsprecher-Knopf von gnome-calls macht, greift dort ins Leere.
# Gilt fuer jedes Geraet, dessen UCM Hoerer und Lautsprecher im Gespraech als getrennte Profile fuehrt.
# 0003: MicState stand bis zum ersten Blick auf die Karte auf 0 = "Mikrofon aus" (kde-telephony-daemon las das beim
# Anmelden und schaltete das Mikrofon stumm); der Zustand folgt jetzt der Quelle der Karte.
QUELLE=callaudiod
DEBIAN=0.1.99-1
DSC_SHA256=3aafdbba2f414327f9772c34c48effb09e96b829b4133b6e94b34c01429d0d51
REVISION=4
STATUS=aktiv
IMAGE="callaudiod"
IMAGE_AN=1
CHANGELOG="Switch the speaker during a call by selecting the voice call profile with the speaker port, but not while the call ends. Keep track of the call when WirePlumber selects the call profile: speaker off and microphone unmuted after a call.
Publish an unknown state until the card has been seen (MicState started as off), follow the mute state of the source of the card, always pass mute requests on, and keep a request that comes during a profile switch for the next source."
