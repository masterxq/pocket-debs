# plasma-workspace mit Korrekturen am Fingerabdruck-Dialog von kcm_users (Einstellungen > Benutzer > Fingerabdruecke).
# 0001: Upstream aa326ad9 (Plasma/6.7, in 6.7.5): Qt::Qml fuer kcm_feedback/lookandfeel/nightlight; mit den
# KDE Frameworks der Suite bricht der Bau sonst ab ("qqml.h: No such file or directory").
# 0002: EnrollStart, DeleteEnrolledFinger und Claim warten in fprintd auf die polkit-Abfrage (auth_self_keep); der KCM
# rief sie mit der D-Bus-Vorgabe von 25 s, danach "Did not receive a reply", Geraet freigegeben, Registrieren
# unmoeglich, wenn PIN-Eingabe mit Bildschirmtastatur laenger dauerte. Jetzt ohne Zeitgrenze (DBUS_TIMEOUT_INFINITE).
# 0003: "enroll-duplicate" (erste Beruehrung passt zu einem schon registrierten Abdruck) beendet die Registrierung mit
# Meldung statt endlos auf den Finger zu warten; das "enroll-failed" nach eigenem Abbruch erscheint nicht mehr als
# Fehler beim naechsten Oeffnen; deutsche Uebersetzung der neuen Meldung (daher auch plasma-workspace-data).
# 0004: QML-Warnung flatFooterButtons (Rest der Portierung auf QQC2.Dialog).
# 0005: libnotificationmanager: Watcher (Sperrbildschirm) koennen antworten (InvokeReply an org.kde.NotificationManager,
# nur fuer registrierte Watcher; WatchedNotificationsModel::reply tat nichts); Aktionen und Antworten des Watchers
# warten auf den Server (hoechstens 1 s), weil der Greeter direkt danach mit _exit endet (sonst im PC-Test 8 von 45 verloren).
# Betroffen: plasma-workspace (kcm_users.so), libnotificationmanager1 (0005); plasma-workspace haengt an
# plasma-workspace-data (>= Quellfassung).
# 0006: Sichtbarkeit je Ansicht (Notifications.visibility/lockScreen, Stufen alles/Absender/App/nichts), Hints
# x-kde-lock-screen-visibility und x-kde-public-summary, Portal hide-(content-)on-lock-screen, Kategorie, urgent ->
# kritisch, display-hint; Einstellungen LockScreenVisibility (Vorgabe Absender), PopupVisibility, HistoryVisibility,
# je App LockScreenVisibility; Quelle WatcherSource fuer den Sperrbildschirm. 0007: Watcher bekommen beim Anmelden die
# vorhandenen Benachrichtigungen und die des Portals, Portal-Aktionen vom Watcher gehen ans Portal. 0008/0009: KCM
# (Abschnitt Datenschutz, je App Sperrbildschirm) mit deutscher Uebersetzung.
# 0010: Gruppieren nach Gespraech: Hint x-kde-conversation-id (ConversationRole), GroupMode GroupConversationsFlat
# (App + Gespraech, ohne Hint der Titel; ohne Inhalt nur App); das Gruppiermodell folgt ersetzten Benachrichtigungen
# und Layout-Aenderungen der Quelle (vorher veraltete Zeilen, z. B. Schublade beim Sperren), kuendigt beim Neuaufbau
# keine entfernten Zeilen innerhalb des Resets an (Absturz der Ansichten), das Sichtbarkeitsmodell
# meldet Filter- statt Layout-Aenderung; Modus-Wechsel haelt die Proxy-Kette verbunden; Test groupingproxymodel_test.
# 0011: Einstellung Feedback je App/Dienst (Ton+Vibration+Licht, Vibration+Licht, nur Licht, nichts), Settings-API
# zum Lesen/Setzen von Sperrbildschirm-Stufe und Feedback einer App, badgeBlacklistedServices. 0012: KCM Feedback je
# App (de); Aenderungen an Sperrbildschirm-Stufe und Feedback machen die KCM uebernehmbar (fehlte in 0008); die
# Listen im Abschnitt Datenschutz waren leer (Modell im Ausdruck von notificationsAvailable gelandet, 0008).
# 0013: Watcher-Quelle: kein Zugriff auf das fehlende Portal-Modell beim Zaehlen ungelesener Benachrichtigungen.
QUELLE=plasma-workspace
DEBIAN=4:6.7.4-2
DSC_SHA256=5e4e5b9365978fa283c64784dd3c5d5251bf4ce1b5b5546bcc8d7ce426761a8e
REVISION=5
STATUS=aktiv
BAUART=source,any,all
IMAGE="plasma-workspace plasma-workspace-data libnotificationmanager1"
IMAGE_AN=1
CHANGELOG="upstream fix aa326ad9: link Qt::Qml in the feedback, look and feel and night light KCMs (build failure with current KDE Frameworks).
kcms/users: no D-Bus timeout for the fprintd calls that wait for polkit authentication (EnrollStart, DeleteEnrolledFinger, Claim); enrolling failed when entering the password took longer than 25 s.
kcms/users: a duplicate fingerprint ends the enrollment with a message; the end of an enrollment the user stopped is no longer shown as a failure; German translation of the new message.
kcms/users: FingerprintDialog: no binding to flatFooterButtons, which QQC2.Dialog does not have.
libnotificationmanager: notification watchers (the Plasma Mobile lock screen) can send inline replies (new method InvokeReply of org.kde.NotificationManager, registered watchers only); actions and replies of a watcher wait for the server, since the lock screen ends right after the unlock.
notificationmanager: how much a view shows of notifications (everything, only the sender of messages, only the application, nothing), with the stricter visibility of the application and of the notification on the lock screen (new hints x-kde-lock-screen-visibility and x-kde-public-summary, portal hide-on-lock-screen and hide-content-on-lock-screen); portal notifications with their category, urgent as critical and the display-hint key; new settings for the lock screen, popups and the history and per application for the lock screen; a model can mirror the notifications of the server for the lock screen.
notificationmanager: notification watchers get the notifications that are already there and those of the portal; actions on portal notifications from a watcher reach the portal.
kcms/notifications: privacy section and lock screen setting per application, German translation.
notificationmanager: notifications grouped by application and conversation (new hint x-kde-conversation-id, otherwise the summary); the grouping follows replaced notifications and layout changes of its source; feedback setting per application (sound, vibration and light, vibration and light, only light, nothing) and settings of a single application for the shell; services without badges; rebuilding the groups no longer announces removed rows within a model reset.
kcms/notifications: feedback per application, German translation; changes of the lock screen visibility and the feedback of an application can be applied; the lists of the privacy section show their entries.
notificationmanager: no crash counting unread notifications of a portal application with the watcher source."
